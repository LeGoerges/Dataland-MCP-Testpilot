springdoc.show-actuator=true
management.endpoints.web.exposure.include=health, info
management.endpoint.health.show-details=always
management.info.git.mode=FULL
server.tomcat.threads.min-spare=100
server.shutdown=graceful
server.servlet.context-path=/specifications
dataland.primary-url=${PROXY_PRIMARY_URL:local-dev.dataland.com}
dataland.specification-folder=/specifications
server.port=8489

spring.jackson2.deserialization.fail-on-unknown-properties=true
server.error.whitelabel.enabled=false
spring.mvc.log-resolved-exception=true
spring.web.resources.add-mappings=false
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=50
dataland.expose-error-stack-trace-to-api=false


springdoc.api-docs.version=OPENAPI_3_0
# Temporary workaround (see https://github.com/OpenAPITools/openapi-generator/issues/10053)
spring.http.converters.preferred-json-mapper=jackson2

# MCP works independently of the optional cloud model.
# Support launches from the repository root and the service directory (Gradle bootRun).
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.ai.mcp.server.name=dataland-frameworks
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.model.chat=${FRAMEWORK_CHAT_PROVIDER:none}
spring.ai.openai.api-key=${FRAMEWORK_CHAT_API_KEY:}
spring.ai.openai.base-url=${FRAMEWORK_CHAT_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.options.model=${FRAMEWORK_CHAT_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.max-completion-tokens=1500
# This model endpoint requires reasoning disabled when using function tools with Chat Completions.
spring.ai.openai.chat.options.reasoning-effort=none
